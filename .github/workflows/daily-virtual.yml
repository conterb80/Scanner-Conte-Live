name: Scanner Conte - Test virtuali quotidiani 1X2 (fonti pubbliche)
# Quote 1X2 con bookmaker e timestamp prima del via. Nessuna REAL.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/collect-daily-virtual.mjs'
      - 'scripts/build-candidate-review.mjs'
      - 'scripts/test-candidate-review.mjs'
      - 'scripts/daily-window.mjs'
      - 'scripts/test-daily-window.mjs'
      - 'scripts/build-weekly-lab-summary.mjs'
      - 'scripts/test-weekly-lab-summary.mjs'
      - '.github/workflows/daily-virtual.yml'
      - 'assets/ai-candidate-bridge.js'
      - 'assets/candidate-review.js'
      - 'scripts/test-ai-candidate-bridge.mjs'
      - 'scripts/update-scanner-candidate-history.mjs'
  schedule:
    # Standard UTC trigger. Europe/Rome windows and daily limits are enforced by the collector.
    # Hourly retries recover a missed trigger; outside local 08-20 no provider call is made.
    - cron: "17 6-19 * * *"
    # Recupero aggiuntivo: GitHub puo ritardare o saltare un trigger pianificato.
    # Il collector registra al massimo due controlli riusciti al giorno.
    - cron: "43 6-19 * * *"

permissions:
  contents: write

concurrency:
  group: scanner-conte-feed
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testa finestra giornaliera e archivio statistico
        run: |
          node scripts/test-ai-candidate-bridge.mjs
          node scripts/test-ai-integration.mjs
          node --check scripts/update-scanner-candidate-history.mjs
          node scripts/test-observation-refresh.mjs
          node scripts/test-daily-window.mjs
          node scripts/test-weekly-lab-summary.mjs
          node --check assets/daily-virtual.js
          node --check assets/candidate-review.js
          node --check assets/ai-candidate-bridge.js
          node --check assets/ai-app.js
          node --check assets/candidate-history.js
          node --check assets/weekly-lab.js
      - name: Registra solo prove 1X2 future con quote pubbliche verificate
        id: collect
        run: |
          set -o pipefail
          node scripts/collect-daily-virtual.mjs 2>&1 | tee /tmp/scanner-collector.log
      - name: Testa il motore di screening senza effettuare giocate REAL
        run: node scripts/test-candidate-review.mjs
      - name: Aggiorna le candidate dalle nuove osservazioni del LAB
        run: node scripts/build-candidate-review.mjs
      - name: Prepara riepilogo virtuale settimanale senza eliminare dati
        run: node scripts/build-weekly-lab-summary.mjs
      - name: Archivia candidate della giornata e aggiorna esiti
        run: node scripts/update-scanner-candidate-history.mjs
      - name: Pubblica LAB e rapporto sperimentale separati
        run: |
          if [ ! -f data/daily_virtual_lab.json ]; then
            echo "Nessun dato valido: archivio invariato"
            exit 0
          fi
          git add data/daily_virtual_lab.json data/candidate_review.json data/weekly_lab_stats.json data/scanner_candidate_history.json
          if git diff --cached --quiet; then
            echo "Nessuna modifica"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Nuove simulazioni virtuali forward 1X2 con fonte documentata"
          git fetch origin main
          git rebase origin/main
          git push

      - name: Conserva la diagnosi se il workflow fallisce
        if: ${{ failure() }}
        env:
          COLLECT_OUTCOME: ${{ steps.collect.outcome }}
        run: |
          node -e "const fs=require('node:fs');const log=fs.existsSync('/tmp/scanner-collector.log')?fs.readFileSync('/tmp/scanner-collector.log','utf8'):'';fs.writeFileSync('data/scanner_run_health.json',JSON.stringify({status:'WORKFLOW_FAILED',failed_at:new Date().toISOString(),collect_outcome:process.env.COLLECT_OUTCOME,workflow:process.env.GITHUB_WORKFLOW,run_id:process.env.GITHUB_RUN_ID,source:'TipsAudit',error:log.trim().slice(-1000)},null,2)+'\\n')"
          git add data/scanner_run_health.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Diagnostica Scanner: workflow non completato"
          git fetch origin main
          git rebase origin/main
          git push
