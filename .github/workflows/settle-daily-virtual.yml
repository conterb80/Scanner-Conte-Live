name: Scanner Conte - Chiudi esiti LAB quotidiano 1X2
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/settle-daily-virtual.yml'
      - 'scripts/settle-daily-virtual.mjs'
      - 'scripts/build-weekly-lab-summary.mjs'
      - 'scripts/test-weekly-lab-summary.mjs'
      - 'scripts/update-scanner-candidate-history.mjs'
      - 'scripts/build-real-watch.mjs'
  schedule:
    - cron: "18 9,23 * * *"
      timezone: "Europe/Rome"

permissions:
  contents: write

concurrency:
  group: scanner-conte-feed
  cancel-in-progress: false

jobs:
  settle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Controlla FT via registro pubblico, non forzare esiti sconosciuti
        run: node scripts/settle-daily-virtual.mjs
      - name: Verifica e ricostruisci le statistiche settimanali senza cancellare lo storico
        run: |
          node scripts/test-weekly-lab-summary.mjs
          node scripts/build-weekly-lab-summary.mjs
      - name: Aggiorna esiti delle candidate gia proposte
        run: node scripts/update-scanner-candidate-history.mjs
      - name: Chiudi osservazioni REAL non piazzate quando arriva un esito verificabile
        run: |
          node scripts/test-real-watch.mjs
          node scripts/build-real-watch.mjs
      - name: Pubblica unicamente lo storico virtuale aggiornato
        run: |
          if [ ! -f data/daily_virtual_lab.json ]; then
            echo "Nessun archivio pubblico ancora"
            exit 0
          fi
          git add data/daily_virtual_lab.json data/weekly_lab_stats.json data/scanner_candidate_history.json data/real_watch_today.json data/real_watch_history.json
          if git diff --cached --quiet; then
            echo "Nessun risultato sicuro disponibile"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Chiudi nuovi test 1X2 con risultati ufficiali registrati dal fornitore"
          git fetch origin main
          git rebase origin/main
          git push
