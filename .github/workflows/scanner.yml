name: Scanner Conte - Raccolta dati
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/scanner.yml'
      - 'scripts/collect-fixtures.mjs'
      - 'scripts/lab-pilot.mjs'
  schedule:
    - cron: "17 7,18 * * *"
      timezone: "Europe/Rome"

permissions:
  contents: write

concurrency:
  group: scanner-conte-feed
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Recupera il palinsesto pubblico
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: node scripts/collect-fixtures.mjs
      - name: Esegui laboratorio pilota solo virtuale
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: node scripts/lab-pilot.mjs
      - name: Salva palinsesto e LAB pubblico
        run: |
          if git diff --quiet -- data/fixtures_latest.json data/lab_auto.json data/odds_latest.json; then
            echo "Nessuna modifica ai dati"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fixtures_latest.json data/lab_auto.json data/odds_latest.json
          git commit -m "Aggiorna feed e test virtuali Scanner Conte"
          git fetch origin main
          git rebase origin/main
          git push
