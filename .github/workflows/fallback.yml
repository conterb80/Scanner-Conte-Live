name: Scanner Conte - Fonte alternativa gratuita
# Fonte privata per ricerca personale: massimo due sessioni di download a settimana.
# Nessuna chiave API richiesta; non usa l'account API-Football sospeso.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/fallback-football-data.mjs'
      - '.github/workflows/fallback.yml'
  schedule:
    - cron: "12 10 * * 2,5"
      timezone: "Europe/Rome"

permissions:
  contents: write

concurrency:
  group: scanner-conte-feed
  cancel-in-progress: false

jobs:
  fallback:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Leggi pochi CSV pubblici (fonte alternativa)
        run: node scripts/fallback-football-data.mjs
      - name: Conserva e pubblica solo riepiloghi del laboratorio virtuale
        run: |
          if git diff --quiet -- data/fixtures_latest.json data/lab_auto.json data/fallback_status.json && [ -z "$(git ls-files --others --exclude-standard data/fallback_status.json)" ]; then
            echo "Nessun aggiornamento"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fixtures_latest.json data/lab_auto.json data/fallback_status.json
          git commit -m "Aggiorna LAB con fonte alternativa gratuita"
          git fetch origin main
          git rebase origin/main
          git push
