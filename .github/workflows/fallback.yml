name: Scanner Conte - Fonte alternativa gratuita
# Fonte privata per ricerca personale: massimo due sessioni di download a settimana.
# Nessuna chiave API richiesta; non usa l'account API-Football sospeso.
on:
  workflow_dispatch:
  schedule:
    # Football-Data pubblica quote martedi entro le 13 UK e venerdi entro le 17 UK.
    # Download DOPO la pubblicazione: al massimo una volta martedi e una venerdi.
    - cron: "15 16 * * 2"
      timezone: "Europe/Rome"
    - cron: "15 19 * * 5"
      timezone: "Europe/Rome"

permissions:
  contents: write

concurrency:
  group: scanner-conte-feed
  cancel-in-progress: false

jobs:
  fallback:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Leggi pochi CSV pubblici (fonte alternativa)
        run: node scripts/fallback-football-data.mjs
      - name: Conserva e pubblica solo riepiloghi del laboratorio virtuale
        run: |
          git add data/fixtures_latest.json data/lab_auto.json data/football_data_status.json
          # Nuovo report storico opzionale: non deve fallire nelle sessioni SKIP.
          if [ -f data/historical_baselines.json ]; then
            git add data/historical_baselines.json
          fi
          if git diff --cached --quiet; then
            echo "Nessun aggiornamento (quota settimanale o dati invariati)"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Aggiorna LAB e confronto storico delle strategie"
          git fetch origin main
          git rebase origin/main
          git push
