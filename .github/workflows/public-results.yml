name: Scanner Conte - Esiti pubblici gratuiti senza API-Football
# Nessuna scommessa viene piazzata. Niente segreti o dati REAL privati.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/collect-public-results.mjs'
      - 'scripts/settle-auto-public.mjs'
      - 'scripts/test-public-results.mjs'
      - '.github/workflows/public-results.yml'
      - 'scripts/settle-chat-analysis.mjs'
      - 'scripts/test-settle-chat-analysis.mjs'
      - 'scripts/test-real-local-settlement.mjs'
      - 'assets/app.js'
  schedule:
    - cron: '13 7,13,19,23 * * *'

permissions:
  contents: write

concurrency:
  group: scanner-conte-feed
  cancel-in-progress: false

jobs:
  results:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verifica filtri FT e rinvii, preserva risultati ufficiali
        run: node scripts/test-public-results.mjs
      - name: Recupera risultati da scoreboard pubblico ESPN (senza chiave)
        run: node scripts/collect-public-results.mjs
      - name: Chiudi test virtuali e aggiorna il riepilogo
        run: |
          node scripts/settle-auto-public.mjs
          node scripts/build-weekly-lab-summary.mjs
      - name: Verifica esiti del registro REAL CONTE in chat
        run: |
          node scripts/test-settle-chat-analysis.mjs
          node scripts/test-real-local-settlement.mjs
          node scripts/settle-chat-analysis.mjs
      - name: Pubblica risultati e riepiloghi virtuali
        run: |
          git add data/results_public.json data/lab_auto.json data/weekly_lab_stats.json data/real_conte_chat.json
          if git diff --cached --quiet; then
            echo 'Nessuna novita nei risultati'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Aggiorna risultati FT pubblici verificati senza API-Football"
          git fetch origin main
          git rebase origin/main
          git push
