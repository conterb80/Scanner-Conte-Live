name: Scanner Conte - Radar palinsesto indipendente
# Solo scouting di partite future: nessun pronostico, test fittizio o quota live inventata.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fixture-radar.yml"
      - "scripts/collect-fixture-radar.mjs"
      - "scripts/test-fixture-radar.mjs"
      - "scripts/radar-source-extras.mjs"
      - "scripts/test-radar-source-extras.mjs"
      - "scripts/check-source-health.mjs"
      - "scripts/test-source-health.mjs"
  schedule:
    - cron: "15 8,16 * * *"
      timezone: "Europe/Rome"

permissions:
  contents: write

concurrency:
  group: scanner-conte-feed
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verifica separazione quote e calendario
        run: |
          node scripts/test-fixture-radar.mjs
          node scripts/test-radar-source-extras.mjs
          node scripts/test-source-health.mjs
      - name: Raccogli palinsesto futuro senza scommesse
        run: node scripts/collect-fixture-radar.mjs
      - name: Diagnostica automatica delle fonti e dei nuovi test
        run: node scripts/check-source-health.mjs
      - name: Pubblica radar e salute delle fonti
        run: |
          git add data/fixture_radar.json data/source_health.json
          if git diff --cached --quiet; then
            echo "Radar invariato"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Aggiorna radar gare future senza quote live"
          git fetch origin main
          git rebase origin/main
          git push
